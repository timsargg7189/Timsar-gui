<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timsar Smart GUI Generator - ULTIMATE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');
        
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 50%, #2a2a00 100%);
            --text-color: #fff; --text-dim: #ddd;
            --header-bg: rgba(26, 26, 26, 0.85); --border-color: #333;
            --card-bg: rgba(26, 26, 26, 0.85); --input-bg: rgba(26, 26, 26, 0.85);
            --footer-bg: rgba(15, 15, 15, 0.95); --code-bg: rgba(0, 0, 0, 0.7);
            --btn-bg: #FFCC00; --btn-text: #000; --accent: #FFCC00;
            --tag-bg: rgba(255, 204, 0, 0.15);
        }
        .light-mode {
            --bg-gradient: linear-gradient(135deg, #f0f0f0 0%, #e0e0e0 50%, #fff9c4 100%);
            --text-color: #222; --text-dim: #555;
            --header-bg: rgba(255, 255, 255, 0.9); --border-color: #ccc;
            --card-bg: rgba(255, 255, 255, 0.9); --input-bg: rgba(255, 255, 255, 0.9);
            --footer-bg: rgba(255, 255, 255, 0.95); --code-bg: rgba(0, 0, 0, 0.05);
            --btn-bg: #ffb300; --btn-text: #000; --accent: #ff8f00;
            --tag-bg: rgba(255, 143, 0, 0.15);
        }

        body { background: var(--bg-gradient); color: var(--text-color); font-family: 'Vazirmatn', sans-serif; padding: 20px; padding-bottom: 80px; margin: 0; min-height: 100vh; transition: 0.3s; }
        .container { max-width: 600px; margin: auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding: 12px 15px; background-color: var(--header-bg); border-radius: 12px; border: 1px solid var(--accent); backdrop-filter: blur(5px); box-shadow: 0 0 15px rgba(255, 204, 0, 0.2); }
        .header h1 { margin: 0; color: var(--accent); font-size: 22px; }
        .header-btns { display: flex; gap: 8px; align-items: center; }
        .icon-btn { background: none; border: 1px solid var(--accent); color: var(--accent); font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: 0.2s; }
        .icon-btn:hover { background: rgba(255, 204, 0, 0.1); }

        .card { background-color: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px rgba(0,0,0,0.1); backdrop-filter: blur(5px); transition: 0.3s; }
        
        .row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 120px; display: flex; flex-direction: column; }
        label { font-size: 13px; color: var(--text-dim); margin-bottom: 5px; }
        
        input, select, textarea { padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); font-size: 14px; outline: none; font-family: inherit; }
        input:focus, select:focus { border-color: var(--accent); }
        input[type="color"] { padding: 2px; height: 40px; cursor: pointer; }

        button { padding: 12px; margin-top: 15px; background: var(--btn-bg); color: var(--btn-text); border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; width: 100%; font-family: inherit; }
        button:hover { background: var(--accent); transform: scale(1.01); }
        
        .copy-btn { background: #4caf50; color: white; }
        .copy-btn:hover { background: #45a049; }
        
        textarea { width: 100%; height: 350px; margin-top: 20px; font-family: monospace; font-size: 12px; color: #a6e3a1; direction: ltr; text-align: left; box-sizing: border-box; }

        .footer { position: fixed; bottom: 0; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; font-size: 12px; color: var(--text-dim); background: var(--footer-bg); border-top: 1px solid var(--accent); box-sizing: border-box; backdrop-filter: blur(10px); }
        
        /* استایل بخش کشویی */
        .dropdown-container {
            margin-bottom: 15px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }
        .dropdown-header {
            padding: 10px 15px;
            background: rgba(255, 204, 0, 0.1);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: var(--accent);
        }
        .dropdown-content {
            display: none;
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
            border-top: 1px solid var(--border-color);
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        .dropdown-content.show {
            display: grid;
        }
        .script-tag {
            background: var(--tag-bg);
            padding: 5px 8px;
            border-radius: 5px;
            font-size: 11px;
            color: var(--text-dim);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            transition: 0.2s;
        }
        .script-tag:hover {
            background: var(--accent);
            color: #000;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🧠 Timsar Smart GUI (Ultimate)</h1>
        <div class="header-btns">
            <button class="icon-btn" id="themeToggleBtn">🌙</button>
        </div>
    </div>

    <div class="card">
        <div class="row">
            <div class="col">
                <label>اسم پنل:</label>
                <input type="text" id="panelName" value="Timsar Hub">
            </div>
            <div class="col">
                <label>فونت:</label>
                <select id="font">
                    <option value="Gotham">Gotham</option>
                    <option value="SourceSans">SourceSans</option>
                    <option value="Arial">Arial</option>
                    <option value="Roboto">Roboto</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label>رنگ اصلی:</label>
                <input type="color" id="mainColor" value="#ffcc00">
            </div>
            <div class="col">
                <label>رنگ متن:</label>
                <input type="color" id="textColor" value="#000000">
            </div>
            <div class="col">
                <label>رنگ هدر:</label>
                <input type="color" id="headerColor" value="#000000">
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label>عرض (px):</label>
                <input type="number" id="panelWidth" value="250">
            </div>
            <div class="col">
                <label>ارتفاع (px):</label>
                <input type="number" id="panelHeight" value="200">
            </div>
            <div class="col">
                <label>گردی گوشه:</label>
                <input type="number" id="cornerRadius" value="12" min="0" max="30">
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label>شفافیت (0 تا 1):</label>
                <input type="number" id="transparency" value="0.2" min="0" max="1" step="0.1">
            </div>
            <div class="col">
                <label>دکمه مینیمایز:</label>
                <select id="minimizeMode">
                    <option value="true">فعال</option>
                    <option value="false">غیرفعال</option>
                </select>
            </div>
            <div class="col">
                <label>قابلیت کشیدن:</label>
                <select id="draggable">
                    <option value="true">فعال</option>
                    <option value="false">غیرفعال</option>
                </select>
            </div>
        </div>

        <!-- بخش کشویی لیست اسکریپت‌ها -->
        <label>📜 لیست اسکریپت‌های موجود (برای استفاده روی اسمشون کلیک کن):</label>
        <div class="dropdown-container">
            <div class="dropdown-header" onclick="toggleDropdown()">
                <span>مشاهده لیست اسکریپت‌ها</span>
                <span id="dropdownIcon">▼</span>
            </div>
            <div class="dropdown-content" id="dropdownContent">
                <!-- اینجا جاوا اسکریپت لیست رو پر میکنه -->
            </div>
        </div>

        <label>اسم دکمه‌ها (با کاما جدا کن):</label>
        <input type="text" id="buttonNames" value="Fly, Speed, ESP, Aimbot, Fling, Noclip, Dex, Ban, Fullbright, Night">

        <button onclick="generateLua()">🚀 ساخت کد هوشمند Lua</button>

        <textarea id="output" readonly placeholder="کد Lua اینجا نمایش داده می‌شه..."></textarea>
        <button class="copy-btn" onclick="copyCode()">📋 کپی کد</button>

        <!-- بخش هشدار -->
        <div style="margin-top: 15px; padding: 10px; background: rgba(255, 0, 0, 0.1); border: 1px solid #ff4444; border-radius: 8px; text-align: center; font-size: 12px; color: #ff8888;">
            ⚠️ <strong>هشدار:</strong> این سایت و اسکریپت‌های داخل آن به صورت تستی هستند و احتمال زیادی وجود دارد که باگ داشته باشند یا به درستی کار نکنند. لطفاً با احتیاط استفاده کنید.
        </div>
    </div>
</div>

<div class="footer">
    <span>Timsar Smart GUI Generator | V4.0 ULTIMATE</span>
</div>

<script>
    // 🧠 دیتابیس (Real Scripts Only)

        "fly": `loadstring(game:HttpGet("https://scriptblox.com/raw/Universal-Script-Universal-Fly-gui-v4-234866"))()`,

        "sword": `loadstring(game:HttpGet("https://rawscripts.net/raw/Universal-Script-GUI-Sword-Kill-all-V6-47125"))()`,

        "java": `loadstring(game:HttpGet("https://rawscripts.net/raw/Universal-Script-Java1x3x5x6-Reimagined-Gui-133104"))()`,

        "h0imer": `loadstring(game:HttpGet("https://rawscripts.net/raw/Universal-Script-h0imer-GUI-V3-186058"))()`,

        "johndoe": `loadstring(game:HttpGet("https://rawscripts.net/raw/Universal-Script-John-doe-script-by-g00byd0lan-10381"))()`,
        "allscripts": `loadstring(game:HttpGet("https://pastebin.com/raw/9qqYhc95"))()`,

        // --- اسکریپت‌های داخلی (لوا مستقیم) ---
        "speed": `game.Players.LocalPlayer.Character.Humanoid.WalkSpeed = 99`,
        "jump": `game.Players.LocalPlayer.Character.Humanoid.JumpPower = 100`,
        "gravity": `game.Workspace.Gravity = 50`,
        "fullbright": `game.Lighting.Brightness = 5; game.Lighting.ClockTime = 14; game.Lighting.Ambient = Color3.fromRGB(255,255,255)`,
        "night": `game.Lighting.ClockTime = 0; game.Lighting.Brightness = 0`,
        "fling": `for _, p in pairs(game.Players:GetPlayers()) do if p ~= game.Players.LocalPlayer and p.Character and p.Character:FindFirstChild("HumanoidRootPart") then p.Character.HumanoidRootPart.CFrame = game.Players.LocalPlayer.Character.HumanoidRootPart.CFrame end end`,
        "noclip": `game.Players.LocalPlayer.Character.Humanoid:ChangeState(11)`,
        "godmode": `game.Players.LocalPlayer.Character.Humanoid.MaxHealth = math.huge; game.Players.LocalPlayer.Character.Humanoid.Health = math.huge`,
        "invisible": `for _, v in pairs(game.Players.LocalPlayer.Character:GetChildren()) do if v:IsA("BasePart") then v.Transparency = 1 end end`,
        "ghost": `for _, v in pairs(game.Players.LocalPlayer.Character:GetChildren()) do if v:IsA("BasePart") then v.Transparency = 0.5; v.CanCollide = false end end`,

        // --- اسکریپت‌های جدید و واقعی (از ScriptBlox) ---
        "xdadmin": `loadstring(game:HttpGet("https://scriptblox.com/raw/Universal-Script-XD-ADMIN-V3-(read-description)-231359"))()`,
        "phantom": `loadstring(game:HttpGet("https://raw.githubusercontent.com/Emdadul37/Admin_Panel_For_Roblox/refs/heads/main/Nova%20Script.lua"))()`,
        "cryptic": `loadstring(game:HttpGet("https://scriptblox.com/raw/Universal-Script-Cryptic-Hub-230349"))()`,
        "orbit": `loadstring(game:HttpGet("https://scriptblox.com/raw/REPLAY-Jailbird-OrbitHub-aimbot-esp-and-more-232617"))()`,
        "criminal": `loadstring(game:HttpGet("https://scriptblox.com/raw/Criminal-Simulator-ALPHA-Hub-or-ESP-Fly-NoClip-or-by-sega1games1-234262"))()`,
        "onetap": `loadstring(game:HttpGet("https://raw.githubusercontent.com/notuziano/scripts/main/onetap.lua"))()`,
        "forktfly": `loadstring(game:HttpGet("https://pasteblox.com/raw/sukitov/fly.lua"))()`,
        "esp7rqxy": `loadstring(game:HttpGet("https://raw.githubusercontent.com/Resxffer/7rqxy/main/esp_k.lua"))()`,
        "homecoming": `loadstring(game:HttpGet("https://scriptblox.com/raw/HOMECOMING-12-Blood-Debt-Keyless-ESP-and-Silent-Aim-239289"))()`,
        "industrialist": `loadstring(game:HttpGet("https://scriptblox.com/raw/Industrialist-OP-Script-Keyless-227159"))()`,
        "easyscripthub": `loadstring(game:HttpGet("https://haxhell.com/raw/universal-script-script-hub"))()`,
        "zxhub": `loadstring(game:HttpGet("https://zx-auth.onrender.com/files/zx.txt"))()`
    };

    // پر کردن لیست کشویی
    function populateDropdown() {
        const container = document.getElementById('dropdownContent');
        const keys = Object.keys(scriptDatabase).sort();
        keys.forEach(key => {
            const span = document.createElement('div');
            span.className = 'script-tag';
            span.innerText = key.toUpperCase();
            span.onclick = () => {
                const input = document.getElementById('buttonNames');
                if (input.value.trim() === "") {
                    input.value = key;
                } else {
                    input.value += ", " + key;
                }
            };
            container.appendChild(span);
        });
    }

    function toggleDropdown() {
        const content = document.getElementById('dropdownContent');
        const icon = document.getElementById('dropdownIcon');
        if (content.classList.contains('show')) {
            content.classList.remove('show');
            icon.innerText = '▼';
        } else {
            content.classList.add('show');
            icon.innerText = '▲';
        }
    }

    const themeToggleBtn = document.getElementById('themeToggleBtn');
    if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); themeToggleBtn.innerText = '☀️'; }
    themeToggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
        if (document.body.classList.contains('light-mode')) { localStorage.setItem('theme', 'light'); themeToggleBtn.innerText = '☀️'; }
        else { localStorage.setItem('theme', 'dark'); themeToggleBtn.innerText = '🌙'; }
    });

    function hexToRgb(hex) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `${r}, ${g}, ${b}`;
    }

    function getSmartCode(name) {
        const n = name.toLowerCase().trim();
        for (const key in scriptDatabase) {
            if (n.includes(key)) {
                return scriptDatabase[key];
            }
        }
        return `-- ⚠️ اسکریپتی برای "${name}" توی دیتابیس پیدا نشد.\n    print("دکمه ${name} کلیک شد!")`;
    }

    function generateLua() {
        const panelName = document.getElementById("panelName").value || "My Panel";
        const font = document.getElementById("font").value;
        const mainColor = document.getElementById("mainColor").value;
        const textColor = document.getElementById("textColor").value;
        const headerColor = document.getElementById("headerColor").value;
        const width = document.getElementById("panelWidth").value;
        const height = document.getElementById("panelHeight").value;
        const cornerRadius = document.getElementById("cornerRadius").value;
        const transparency = document.getElementById("transparency").value;
        const minimizeMode = document.getElementById("minimizeMode").value;
        const draggable = document.getElementById("draggable").value;
        const btnNames = document.getElementById("buttonNames").value.split(",").map(s => s.trim()).filter(s => s !== "");

        const mainRgb = hexToRgb(mainColor);
        const textRgb = hexToRgb(textColor);
        const headerRgb = hexToRgb(headerColor);

        let buttonsCode = "";
        btnNames.forEach((name, index) => {
            const smartCode = getSmartCode(name);
            buttonsCode += `
    local btn${index + 1} = Instance.new("TextButton")
    btn${index + 1}.Size = UDim2.new(1, -10, 0, 35)
    btn${index + 1}.Position = UDim2.new(0, 5, 0, ${40 + (index * 40)})
    btn${index + 1}.BackgroundColor3 = Color3.fromRGB(30, 30, 30)
    btn${index + 1}.TextColor3 = Color3.fromRGB(${textRgb})
    btn${index + 1}.Text = "${name}"
    btn${index + 1}.Font = Enum.Font.${font}
    btn${index + 1}.TextSize = 14
    btn${index + 1}.Parent = scroll
    btn${index + 1}.MouseButton1Click:Connect(function()
        pcall(function()
            ${smartCode}
        end)
    end)
`;
        });

        let minimizeCode = "";
        if (minimizeMode === "true") {
            minimizeCode = `
local minimizeBtn = Instance.new("TextButton")
minimizeBtn.Size = UDim2.new(0, 24, 0, 24)
minimizeBtn.Position = UDim2.new(1, -28, 0, 3)
minimizeBtn.BackgroundColor3 = Color3.fromRGB(200, 30, 30)
minimizeBtn.Text = "—"
minimizeBtn.TextColor3 = Color3.fromRGB(255, 255, 255)
